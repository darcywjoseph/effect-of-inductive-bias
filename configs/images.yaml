dataset: cifar100
data_root: data
metric: top1
data: {val_per_class: 50, split_seed: 0}
grid: ["1%", "2%", "5%", "10%", "20%", "50%", "100%"]
anchors: ["1%", "10%", "100%"]
# Target rule: CNN with augmentation, seed-mean test score at these sizes.
targets: {reference: {model: cnn, treatment: aug}, sizes: ["10%", "50%"]}
seeds: [0, 1, 2]
optimiser: {name: adamw, warmup_frac: 0.05, schedule: cosine}
batch_size: 128
precision: bf16  # autocast for every model alike
workers: 8  # CPU augmentation workers
steps: {epochs_equivalent: 200, min: 2000, max: 40000, evals: 20}
sweep:
  lr: [1.0e-4, 3.0e-4, 1.0e-3]
  # Rungs past the grid, tried only where the best lr sits at an edge.
  lr_ladder: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  weight_decay: [0.05, 0.1]
  seed: 0
# The brief's nine configurations, CNN + LeJEPA (its optional tenth), and
# both models from ImageNet-1k weights, so the pretrained-start comparison
# gives the CNN and the ViT the same outside data.
configurations:
  - [cnn, none]
  - [cnn, aug]
  - [cnn, lejepa]
  - [vit, none]
  - [vit, aug]
  - [vit, lejepa]
  - [vit, imagenet]
  - [vit, imagenet1k]
  - [cnn, imagenet1k]
  - [mlp, none]
  - [mlp, aug]
  - [mlp, lejepa]
# Does the step budget let each model converge? These setups rerun at
# factor x the budget, seed 0, final settings. Rule, fixed before results:
# a gain in validation score of threshold or more means the budget is too
# short; then max steps rises for every model and finals are rerun.
budget_check:
  factor: 2
  threshold: 0.01
  sizes: ["10%", "100%"]
  configurations:
    - [cnn, none]
    - [cnn, aug]
    - [vit, none]
    - [vit, aug]
bootstrap: {draws: 10000, level: 0.95}
results_dir: results
# LeJEPA pretraining on the whole pool, labels removed. One backbone per
# model and seed, reused at every data size. Values follow the authors'
# minimal reference (MINIMAL.md) and README; wd per model as the README says.
lejepa:
  epochs: 200
  batch: 256
  views: 4
  lam: 0.02
  proj_dim: 16
  slices: 256
  lr: 2.0e-3
  warmup_frac: 0.05
  weight_decay: {cnn: 5.0e-4, vit: 0.05, mlp: 0.05}
  checkpoint_dir: checkpoints/lejepa
