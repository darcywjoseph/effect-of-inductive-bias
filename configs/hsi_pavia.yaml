dataset: pavia_university
data_root: data
metric: balanced_acc
data: {block: 24, patch_radius: 2, fractions: [0.6, 0.2, 0.2], split_seed: 0, tries: 2000, noise_std: 0.05}
grid: ["5pc", "10pc", "20pc", "50pc", "100pc", "200pc", "all"]
anchors: ["5pc", "50pc", "all"]
targets: {reference: {model: cnn, treatment: aug}, sizes: ["20pc", "100pc"]}
seeds: [0, 1, 2]
optimiser: {name: adamw, warmup_frac: 0.05, schedule: cosine}
batch_size: 128
precision: bf16  # autocast for every model alike
workers: 8  # CPU augmentation workers
steps: {epochs_equivalent: 200, min: 2000, max: 40000, evals: 20}
sweep:
  lr: [1.0e-4, 3.0e-4, 1.0e-3]
  # Rungs past the grid, tried only where the best lr sits at an edge.
  lr_ladder: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  weight_decay: [0.05, 0.1]
  seed: 0
# The brief's nine configurations plus CNN + LeJEPA (its optional tenth).
configurations:
  - [cnn, none]
  - [cnn, aug]
  - [cnn, lejepa]
  - [vit, none]
  - [vit, aug]
  - [vit, lejepa]
  - [vit, imagenet]
  - [mlp, none]
  - [mlp, aug]
  - [mlp, lejepa]
bootstrap: {draws: 10000, level: 0.95}
results_dir: results
# LeJEPA pretraining on the training-block pixels, labels removed. Views
# are the standard patch augmentation. 200 epochs of the ~22-26k-pixel
# pool is about 17-20k steps.
lejepa:
  epochs: 200
  batch: 256
  views: 4
  lam: 0.02
  proj_dim: 16
  slices: 256
  lr: 2.0e-3
  warmup_frac: 0.05
  weight_decay: {cnn: 5.0e-4, vit: 0.05, mlp: 0.05}
  checkpoint_dir: checkpoints/lejepa
